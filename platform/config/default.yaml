capabilities:
  secret_detection: true
  static_analysis: true
  dependency_analysis: true
  infrastructure_analysis: true
  build: false
  unit_testing: false
  integration_testing: false
  container_build: false
  container_scan: false
  sbom: false
  provenance: false
  policy_enforcement: false
  gitops_update: false
  image_signing: false
  admission_control: false
  cluster_validation: false

build:
  working_directory: .
  runtime:
    language: node
    version: "22"
    package_manager: null
  command: null

testing:
  working_directory: .
  unit:
    enabled: true
    command: null
  integration:
    enabled: false
    command: null

container:
  dockerfile: ./Dockerfile
  context: .
  image:
    name: application
    tag: null
  registry:
    type: dockerhub
    repository: null

cluster_validation:
  environment: dev
  rollout:
    timeout_seconds: 180
    poll_interval_seconds: 5
  smoke_tests:
    enabled: true
    timeout_seconds: 120
    command: null

policy:
  paths: []
  policy_paths: []