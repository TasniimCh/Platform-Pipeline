capabilities:
  secret_detection: true
  static_analysis: true
  dependency_analysis: true
  infrastructure_analysis: true

  build: false
  unit_testing: false
  integration_testing: false

  container_build: false
  container_scan: false
  sbom: false
  provenance: false
  image_publish: false
  image_signing: false

  policy_enforcement: false

  gitops_update: false

  admission_control: false
  cluster_validation: false


build:
  working_directory: .
  runtime:
    language: node
    version: "22"
    package_manager: null
  command: null


testing:
  working_directory: .
  unit:
    enabled: true
    command: null
  integration:
    enabled: false
    command: null


container:
  dockerfile: ./Dockerfile
  context: .
  image:
    name: application
    tag: null
  registry:
    type: dockerhub
    repository: null


gitops:
  repository: null
  ref: main
  values_file: null

  argocd:
    application_name: null
    path: null
    namespace: dev
    project: default
    sync_policy: manual

  commit:
    author_name: Platform Bot
    author_email: platform@example.com


cluster_validation:
  enabled: true
  environment: dev
  namespace: dev

  argocd:
    enabled: true
    application_name: null
    timeout_seconds: 180

  admission:
    enabled: true
    engine: kyverno
    enforce: true

    image_verification:
      enabled: true
      keyless:
        issuer: https://token.actions.githubusercontent.com
        subject_regexp: null

  rollout:
    enabled: true
    deployment: null
    timeout_seconds: 180
    poll_interval_seconds: 5

  smoke_tests:
    enabled: true
    service: null
    port: 80
    path: /health
    timeout_seconds: 120


policy:
  paths: []
  policy_paths: []