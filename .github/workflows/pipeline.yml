name: Platform Pipeline

on:
  push:
  workflow_call:
    secrets:
      SNYK_TOKEN:
        required: true
    inputs:
      config-file:
        type : string
        required: false
        default: .devsecops/pipeline.yaml
      report-directory:
        type : string
        required: false
        default: .devsecops/reports
      log-level:
        type : string
        required: false
        default: info

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    outputs:
      config-file: ${{ steps.set-vars.outputs.config-file }}
      report-directory: ${{ steps.set-vars.outputs.report-directory }}
      log-level: ${{ steps.set-vars.outputs.log-level }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set required variables
        id: set-vars
        run: |
          echo "config-file=${{ inputs.config-file }}" >> $GITHUB_OUTPUT
          echo "report-directory=${{ inputs.report-directory }}" >> $GITHUB_OUTPUT
          echo "log-level=${{ inputs.log-level }}" >> $GITHUB_OUTPUT

      - name: Checkout platform repository
        uses: actions/checkout@v4
        with:
          repository: TasniimCh/Platform-Pipeline
          ref: supply-chain
          path: platform

      - name: Bootstrap platform environment
        shell: bash
        run: |
          set -euo pipefail
          export WORKSPACE="$GITHUB_WORKSPACE"
          export CONFIG_FILE="${{ inputs.config-file }}"
          export REPORT_DIR="${{ inputs.report-directory }}"
          export LOG_LEVEL="${{ inputs.log-level }}"
          bash "${{ github.workspace }}/platform/platform/bootstrap/bootstrap.sh"
          bash "${{ github.workspace }}/platform/platform/bootstrap/install-tools.sh" "${{ github.workspace }}/${{ inputs.config-file }}"

  build_test:
    needs: bootstrap
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout platform repository
        uses: actions/checkout@v4
        with:
          repository: TasniimCh/Platform-Pipeline
          ref: supply-chain
          path: platform

      - name: Install required tools
        shell: bash
        run: |
          set -euo pipefail
          export WORKSPACE="$GITHUB_WORKSPACE"
          export CONFIG_FILE="${{ needs.bootstrap.outputs.config-file }}"
          export REPORT_DIR="${{ needs.bootstrap.outputs.report-directory }}"
          export LOG_LEVEL="${{ needs.bootstrap.outputs.log-level }}"
          bash "${{ github.workspace }}/platform/platform/bootstrap/install-tools.sh" "${{ github.workspace }}/${{ needs.bootstrap.outputs.config-file }}"

      - name: Run Build & Test provider
        shell: bash
        run: |
          set -euo pipefail
          export WORKSPACE="$GITHUB_WORKSPACE"
          export CONFIG_FILE="${{ needs.bootstrap.outputs.config-file }}"
          export REPORT_DIR="${{ needs.bootstrap.outputs.report-directory }}"
          export LOG_LEVEL="${{ needs.bootstrap.outputs.log-level }}"
          bash "${{ github.workspace }}/platform/platform/build-test/run.sh"

      - name: Upload Build & Test reports
        uses: actions/upload-artifact@v4
        with:
          name: build-test-reports
          path: .devsecops/reports/build
          if-no-files-found: warn

      - name: Upload Test reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: .devsecops/reports/tests
          if-no-files-found: warn

  policy_testing:
    needs: [bootstrap,build_test]
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout platform repository
        uses: actions/checkout@v4
        with:
          repository: TasniimCh/Platform-Pipeline
          ref: supply-chain
          path: platform

      - name: Install required tools
        shell: bash
        run: |
           set -euo pipefail

           export WORKSPACE="$GITHUB_WORKSPACE"
           export CONFIG_FILE="${{ needs.bootstrap.outputs.config-file }}"
           export REPORT_DIR="${{ needs.bootstrap.outputs.report-directory }}"
           export LOG_LEVEL="${{ needs.bootstrap.outputs.log-level }}"

           export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"

           bash "${GITHUB_WORKSPACE}/platform/platform/bootstrap/install-tools.sh" \
             "${GITHUB_WORKSPACE}/${CONFIG_FILE}"

           echo "PATH=$PATH"

           echo "Checking Conftest..."
           command -v conftest
           conftest --version

      - name: Run CI Policy Testing provider
        shell: bash
        run: |
          set -euo pipefail

          export WORKSPACE="$GITHUB_WORKSPACE"
          export CONFIG_FILE="${{ needs.bootstrap.outputs.config-file }}"
          export REPORT_DIR="${{ needs.bootstrap.outputs.report-directory }}"
          export LOG_LEVEL="${{ needs.bootstrap.outputs.log-level }}"

          export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"

          echo "Checking Conftest before policy execution..."
          command -v conftest
          conftest --version

          bash "${GITHUB_WORKSPACE}/platform/platform/policy/run.sh"
      - name: Upload CI Policy Testing reports
        uses: actions/upload-artifact@v4
        with:
          name: policy-testing-reports
          path: .devsecops/reports/policy
          if-no-files-found: warn

  supply_chain:
    needs: [bootstrap, build_test, policy_testing]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout platform repository
        uses: actions/checkout@v4
        with:
          repository: TasniimCh/Platform-Pipeline
          ref: supply-chain
          path: platform

      - name: Install container tools
        shell: bash
        run: |
          set -euo pipefail
          export WORKSPACE="$GITHUB_WORKSPACE"
          export CONFIG_FILE="${{ needs.bootstrap.outputs.config-file }}"
          export REPORT_DIR="${{ needs.bootstrap.outputs.report-directory }}"
          export LOG_LEVEL="${{ needs.bootstrap.outputs.log-level }}"
          bash "${{ github.workspace }}/platform/platform/bootstrap/install-tools.sh" "${{ github.workspace }}/${{ needs.bootstrap.outputs.config-file }}"

      - name: Run Container & Supply-Chain provider
        shell: bash
        run: |
          set -euo pipefail
          export WORKSPACE="$GITHUB_WORKSPACE"
          export CONFIG_FILE="${{ needs.bootstrap.outputs.config-file }}"
          export REPORT_DIR="${{ needs.bootstrap.outputs.report-directory }}"
          export LOG_LEVEL="${{ needs.bootstrap.outputs.log-level }}"
          bash "${{ github.workspace }}/platform/platform/container/run.sh"

      - name: Upload container reports
        uses: actions/upload-artifact@v4
        with:
          name: container-supply-chain-reports
          path: .devsecops/reports/container
          if-no-files-found: warn

  scanners:
    needs: [bootstrap, build_test,policy_testing, supply_chain]
    runs-on: ubuntu-latest

    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    strategy:
      matrix:
        scanner: [gitleaks, semgrep, snyk, checkov]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout platform repository
        uses: actions/checkout@v4
        with:
          repository: TasniimCh/Platform-Pipeline
          ref: supply-chain
          path: platform

      - name: Install scanner tools
        shell: bash
        run: |
          set -euo pipefail
          export WORKSPACE="$GITHUB_WORKSPACE"
          export CONFIG_FILE="${{ needs.bootstrap.outputs.config-file }}"
          export REPORT_DIR="${{ needs.bootstrap.outputs.report-directory }}"
          export LOG_LEVEL="${{ needs.bootstrap.outputs.log-level }}"
          bash "${{ github.workspace }}/platform/platform/bootstrap/install-tools.sh" "${{ github.workspace }}/${{ needs.bootstrap.outputs.config-file }}"

      - name: Run scanner
        shell: bash
        run: |
          set -euo pipefail
          export WORKSPACE="$GITHUB_WORKSPACE"
          export CONFIG_FILE="${{ needs.bootstrap.outputs.config-file }}"
          export REPORT_DIR="${{ needs.bootstrap.outputs.report-directory }}"
          export LOG_LEVEL="${{ needs.bootstrap.outputs.log-level }}"
          bash "${{ github.workspace }}/platform/platform/scanners/run-scanner.sh" "${{ matrix.scanner }}"

      - name: Upload scanner report
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.scanner }}
          path: .devsecops/reports/${{ matrix.scanner }}
          if-no-files-found: warn

  risk_assessment:
    needs: [bootstrap, build_test, policy_testing, supply_chain, scanners]
    runs-on: ubuntu-latest
    outputs:
      decision: ${{ steps.run-risk-advisor.outputs.decision }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout platform repository
        uses: actions/checkout@v4
        with:
          repository: TasniimCh/Platform-Pipeline
          ref: supply-chain
          path: platform

      - name: Download standard report artifacts
        uses: actions/download-artifact@v4
        with:
          path: .devsecops/reports
          pattern: "*-reports"
          merge-multiple: false

      - name: Download scanner report artifacts
        uses: actions/download-artifact@v4
        with:
          path: .devsecops/reports
          pattern: "report-*"
          merge-multiple: false

      - name: Install required tools
        shell: bash
        run: |
          set -euo pipefail
          export WORKSPACE="$GITHUB_WORKSPACE"
          export CONFIG_FILE="${{ needs.bootstrap.outputs.config-file }}"
          export REPORT_DIR="${{ needs.bootstrap.outputs.report-directory }}"
          export LOG_LEVEL="${{ needs.bootstrap.outputs.log-level }}"
          bash "${{ github.workspace }}/platform/platform/bootstrap/install-tools.sh" "${{ github.workspace }}/${{ needs.bootstrap.outputs.config-file }}"

      - name: Run AI Risk Advisor provider
        id: run-risk-advisor
        shell: bash
        run: |
          set -euo pipefail
          export WORKSPACE="$GITHUB_WORKSPACE"
          export CONFIG_FILE="${{ needs.bootstrap.outputs.config-file }}"
          export REPORT_DIR="${{ needs.bootstrap.outputs.report-directory }}"
          export LOG_LEVEL="${{ needs.bootstrap.outputs.log-level }}"
          bash "${{ github.workspace }}/platform/platform/risk/run.sh"
          decision=$(python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('.devsecops/reports/risk/assessment.json')
          if not path.exists():
              raise SystemExit('Missing risk assessment report')
          with path.open('r', encoding='utf-8') as fh:
              payload = json.load(fh)
          print(payload.get('decision_reference', {}).get('action', 'manual_approval'))
          PY
          )
          echo "decision=$decision" >> "$GITHUB_OUTPUT"

      - name: Upload Risk Assessment report
        uses: actions/upload-artifact@v4
        with:
          name: risk-assessment-report
          path: .devsecops/reports/risk
          if-no-files-found: warn

  gitops:
    needs: [bootstrap, risk_assessment]
    if: ${{ needs.risk_assessment.outputs.decision == 'promote' || needs.risk_assessment.outputs.decision == 'manual_approval' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout platform repository
        uses: actions/checkout@v4
        with:
          repository: TasniimCh/Platform-Pipeline
          ref: supply-chain
          path: platform

      - name: Install required tools
        shell: bash
        run: |
          set -euo pipefail
          export WORKSPACE="$GITHUB_WORKSPACE"
          export CONFIG_FILE="${{ needs.bootstrap.outputs.config-file }}"
          export REPORT_DIR="${{ needs.bootstrap.outputs.report-directory }}"
          export LOG_LEVEL="${{ needs.bootstrap.outputs.log-level }}"
          bash "${{ github.workspace }}/platform/platform/bootstrap/install-tools.sh" "${{ github.workspace }}/${{ needs.bootstrap.outputs.config-file }}"

      - name: Run GitOps update provider
        shell: bash
        run: |
          set -euo pipefail
          export WORKSPACE="$GITHUB_WORKSPACE"
          export CONFIG_FILE="${{ needs.bootstrap.outputs.config-file }}"
          export REPORT_DIR="${{ needs.bootstrap.outputs.report-directory }}"
          export LOG_LEVEL="${{ needs.bootstrap.outputs.log-level }}"
          export GITOPS_DECISION="${{ needs.risk_assessment.outputs.decision }}"
          bash "${{ github.workspace }}/platform/platform/gitops/run.sh"

      - name: Upload GitOps update report
        uses: actions/upload-artifact@v4
        with:
          name: gitops-update-report
          path: .devsecops/reports/gitops
          if-no-files-found: warn

  cluster_validation:
    needs: [bootstrap, gitops]
    if: ${{ always() && needs.gitops.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      # TBD: final cluster credential name to be agreed with platform ops.
      KUBECONFIG: ${{ secrets.KUBECONFIG }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout platform repository
        uses: actions/checkout@v4
        with:
          repository: TasniimCh/Platform-Pipeline
          ref: supply-chain
          path: platform

      - name: Install required tools
        shell: bash
        run: |
          set -euo pipefail
          export WORKSPACE="$GITHUB_WORKSPACE"
          export CONFIG_FILE="${{ needs.bootstrap.outputs.config-file }}"
          export REPORT_DIR="${{ needs.bootstrap.outputs.report-directory }}"
          export LOG_LEVEL="${{ needs.bootstrap.outputs.log-level }}"
          bash "${{ github.workspace }}/platform/platform/bootstrap/install-tools.sh" "${{ github.workspace }}/${{ needs.bootstrap.outputs.config-file }}"

      - name: Run cluster validation provider
        shell: bash
        run: |
          set -euo pipefail
          export WORKSPACE="$GITHUB_WORKSPACE"
          export CONFIG_FILE="${{ needs.bootstrap.outputs.config-file }}"
          export REPORT_DIR="${{ needs.bootstrap.outputs.report-directory }}"
          export LOG_LEVEL="${{ needs.bootstrap.outputs.log-level }}"
          bash "${{ github.workspace }}/platform/platform/cluster-validation/run.sh"

      - name: Upload cluster validation report
        uses: actions/upload-artifact@v4
        with:
          name: cluster-validation-report
          path: .devsecops/reports/cluster-validation
          if-no-files-found: warn

  pipeline_summary:
    needs: [risk_assessment, gitops, cluster_validation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize pipeline outcome
        shell: bash
        run: |
          set -euo pipefail
          echo "Risk assessment decision: ${{ needs.risk_assessment.result }}"
          echo "GitOps job result: ${{ needs.gitops.result || 'skipped' }}"
          echo "Cluster validation result: ${{ needs.cluster_validation.result || 'skipped' }}"
