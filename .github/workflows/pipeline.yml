name: Platform Pipeline

on:

  workflow_call:

jobs:

  context:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout consumer repository
        uses: actions/checkout@v4

      - name: Load Context
        run: ./scripts/load-context.sh

  phase1:

    needs: context

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - run: ./scripts/phase1.sh

  phase2:

    needs: phase1

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - run: ./scripts/phase2.sh

  phase3:

    needs: phase2

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - run: ./scripts/phase3.sh