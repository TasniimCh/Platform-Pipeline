name: Platform Pipeline

on:
  workflow_call:
    secrets:
      SNYK_TOKEN:
        required: false
      GITOPS_TOKEN:
        required: false
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
    inputs:
      config-file:
        type: string
        required: false
        default: .devsecops/pipeline.yaml
      report-directory:
        type: string
        required: false
        default: .devsecops/reports
      log-level:
        type: string
        required: false
        default: info

      image-repository:
        description: "Externally published container image repository"
        required: false
        type: string
        default: ""

      image-digest:
        description: "Externally published container image digest (sha256:...)"
        required: false
        type: string
        default: ""

jobs:
  # ──────────────────────────────────────────────────────────────────
  # STAGE 0 — bootstrap: checkout, minimal env setup, and — crucially —
  # resolve the client config ONCE via the platform repo's own
  # load_merged_config_json()/enabled_scanner_tools() (default.yaml +
  # client config + capabilities.yaml merge), and expose the result as
  # job outputs. Every later job reads these outputs instead of
  # re-merging the YAML itself, and gates itself with `if:`. This keeps
  # exactly one implementation of the merge/precedence logic, shared by
  # the workflow-level gating and by each phase script's own internal checks.
  # ──────────────────────────────────────────────────────────────────
  bootstrap:
    name: Bootstrap platform
    runs-on: ubuntu-latest

    outputs:
      config_file: ${{ steps.set_vars.outputs.config_file }}
      report_directory: ${{ steps.set_vars.outputs.report_directory }}
      log_level: ${{ steps.set_vars.outputs.log_level }}
      capabilities: ${{ steps.flags.outputs.capabilities }}
      build_stage: ${{ steps.flags.outputs.build_stage }}
      container_stage: ${{ steps.flags.outputs.container_stage }}
      code_scanners: ${{ steps.flags.outputs.code_scanners }}

    steps:
      - name: Checkout client repository
        uses: actions/checkout@v5

      - name: Set workflow variables
        id: set_vars
        shell: bash
        env:
          INPUT_CONFIG_FILE: ${{ inputs['config-file'] }}
          INPUT_REPORT_DIRECTORY: ${{ inputs['report-directory'] }}
          INPUT_LOG_LEVEL: ${{ inputs['log-level'] }}
        run: |
          set -euo pipefail

          config_file="${INPUT_CONFIG_FILE:-.devsecops/pipeline.yaml}"
          report_directory="${INPUT_REPORT_DIRECTORY:-.devsecops/reports}"
          log_level="${INPUT_LOG_LEVEL:-info}"

          echo "config_file=$config_file" >> "$GITHUB_OUTPUT"
          echo "report_directory=$report_directory" >> "$GITHUB_OUTPUT"
          echo "log_level=$log_level" >> "$GITHUB_OUTPUT"

          echo "Resolved config file: $config_file"
          echo "Resolved report directory: $report_directory"
          echo "Resolved log level: $log_level"

      - name: Checkout platform repository
        uses: actions/checkout@v5
        with:
          repository: TasniimCh/Platform-Pipeline
          ref: risk-advisor
          path: platform

      - name: Install configuration dependency
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v python3 >/dev/null 2>&1; then
            echo "Python 3 is required but unavailable" >&2
            exit 3
          fi

          if ! python3 -c "import yaml" >/dev/null 2>&1; then
            if ! command -v pip3 >/dev/null 2>&1; then
              echo "pip3 is required to install PyYAML" >&2
              exit 3
            fi

            python3 -m pip install --user --quiet pyyaml
          fi

      - name: Bootstrap platform environment
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
          CONFIG_FILE: ${{ steps.set_vars.outputs.config_file }}
          REPORT_DIR: ${{ steps.set_vars.outputs.report_directory }}
          LOG_LEVEL: ${{ steps.set_vars.outputs.log_level }}
        run: |
          set -euo pipefail

          : "${WORKSPACE:?WORKSPACE is empty}"
          : "${CONFIG_FILE:?CONFIG_FILE is empty}"
          : "${REPORT_DIR:?REPORT_DIR is empty}"

          bash \
            "$GITHUB_WORKSPACE/platform/platform/bootstrap/bootstrap.sh"

      - name: Resolve capability flags
        id: flags
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
          CONFIG_FILE: ${{ steps.set_vars.outputs.config_file }}
          LOG_LEVEL: ${{ steps.set_vars.outputs.log_level }}
        run: |
          set -euo pipefail

          source \
            "$GITHUB_WORKSPACE/platform/platform/config/config.sh"

          CONFIG_JSON="$(
            load_merged_config_json "$WORKSPACE" "$CONFIG_FILE"
          )"

          SCANNER_TOOLS="$(
            enabled_scanner_tools "$WORKSPACE" "$CONFIG_FILE"
          )"

          CONFIG_JSON="$CONFIG_JSON" \
          SCANNER_TOOLS="$SCANNER_TOOLS" \
          python3 - <<'PY'
          import json
          import os

          config = json.loads(os.environ["CONFIG_JSON"])
          capabilities = config.get("capabilities", {})

          if not isinstance(capabilities, dict):
              raise TypeError("'capabilities' must be a JSON object")

          def enabled(name):
              return capabilities.get(name) is True

          build_stage = any(
              enabled(name)
              for name in (
                  "build",
                  "unit_testing",
                  "integration_testing",
              )
          )

          container_stage = any(
              enabled(name)
              for name in (
                  "container_build",
                  "container_scan",
                  "sbom",
                  "provenance",
                  "image_publish",
                  "image_signing",
              )
          )

          supported_scanners = {
              "gitleaks",
              "semgrep",
              "snyk",
              "checkov",
          }

          code_scanners = []

          for provider in os.environ.get(
              "SCANNER_TOOLS",
              "",
          ).split():
              if (
                  provider in supported_scanners
                  and provider not in code_scanners
              ):
                  code_scanners.append(provider)

          outputs = {
              "capabilities": json.dumps(
                  capabilities,
                  separators=(",", ":"),
              ),
              "build_stage": str(build_stage).lower(),
              "container_stage": str(container_stage).lower(),
              "code_scanners": json.dumps(
                  code_scanners,
                  separators=(",", ":"),
              ),
          }

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as output_file:
              for name, value in outputs.items():
                  output_file.write(f"{name}={value}\n")
          PY

      - name: Verify bootstrap outputs
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.set_vars.outputs.config_file }}
          REPORT_DIR: ${{ steps.set_vars.outputs.report_directory }}
          BUILD_STAGE: ${{ steps.flags.outputs.build_stage }}
          CONTAINER_STAGE: ${{ steps.flags.outputs.container_stage }}
          CODE_SCANNERS: ${{ steps.flags.outputs.code_scanners }}
        run: |
          set -euo pipefail

          : "${CONFIG_FILE:?config_file output is empty}"
          : "${REPORT_DIR:?report_directory output is empty}"
          : "${BUILD_STAGE:?build_stage output is empty}"
          : "${CONTAINER_STAGE:?container_stage output is empty}"
          : "${CODE_SCANNERS:?code_scanners output is empty}"

          echo "CONFIG_FILE=$CONFIG_FILE"
          echo "REPORT_DIR=$REPORT_DIR"
          echo "BUILD_STAGE=$BUILD_STAGE"
          echo "CONTAINER_STAGE=$CONTAINER_STAGE"
          echo "CODE_SCANNERS=$CODE_SCANNERS"


    # ──────────────────────────────────────────────────────────────────
  # STAGE 1 — Credential preflight
  #
  # This is not a source-code secret scan. It verifies that credentials
  # required by enabled client capabilities are available before costly
  # jobs begin.
  # ──────────────────────────────────────────────────────────────────
  validate_secrets:
    name: Validate required credentials
    needs: bootstrap
    runs-on: ubuntu-latest

    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout platform repository
        uses: actions/checkout@v4
        with:
          repository: TasniimCh/Platform-Pipeline
          ref: risk-advisor
          path: platform

      - name: Validate required GitHub Actions secrets
        shell: bash
        env:
          CAPABILITIES_JSON: ${{ needs.bootstrap.outputs.capabilities }}
        run: |
          set -euo pipefail

          export LOG_LEVEL="${{ needs.bootstrap.outputs.log_level }}"

          bash \
            "$GITHUB_WORKSPACE/platform/platform/bootstrap/validate-secrets.sh"

# ──────────────────────────────────────────────────────────────────
  # STAGE 2 — Parallel code-security scanners
  #
  # Gitleaks, Semgrep, Snyk, and Checkov are included dynamically
  # according to the resolved client capabilities.
  # ──────────────────────────────────────────────────────────────────
  code_scans:
    name: Code scan — ${{ matrix.scanner }}
    needs:
      - bootstrap
      - validate_secrets

    if: >-
      ${{ needs.bootstrap.result == 'success' &&
          needs.validate_secrets.result == 'success' &&
          needs.bootstrap.outputs.code_scanners != '[]' }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        scanner: ${{ fromJSON(needs.bootstrap.outputs.code_scanners) }}

    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Checkout client repository
        uses: actions/checkout@v4

      - name: Checkout platform repository
        uses: actions/checkout@v4
        with:
          repository: TasniimCh/Platform-Pipeline
          ref: risk-advisor
          path: platform

      - name: Install scanner
        shell: bash
        run: |
          set -euo pipefail

          export WORKSPACE="$GITHUB_WORKSPACE"
          export CONFIG_FILE="${{ needs.bootstrap.outputs.config_file }}"
          export REPORT_DIR="${{ needs.bootstrap.outputs.report_directory }}"
          export LOG_LEVEL="${{ needs.bootstrap.outputs.log_level }}"

          bash \
            "$GITHUB_WORKSPACE/platform/platform/bootstrap/install-tools.sh" \
            "$GITHUB_WORKSPACE/${{ needs.bootstrap.outputs.config_file }}" \
            "${{ matrix.scanner }}"

      - name: Run scanner
        shell: bash
        env:
          ENABLED_CODE_SCANNERS: ${{ needs.bootstrap.outputs.code_scanners }}
        run: |
          set -euo pipefail

          export WORKSPACE="$GITHUB_WORKSPACE"
          export CONFIG_FILE="${{ needs.bootstrap.outputs.config_file }}"
          export REPORT_DIR="${{ needs.bootstrap.outputs.report_directory }}"
          export LOG_LEVEL="${{ needs.bootstrap.outputs.log_level }}"

          bash \
            "$GITHUB_WORKSPACE/platform/platform/scanners/run-scanner.sh" \
            "${{ matrix.scanner }}"

      - name: Upload scanner report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: report-code-scan-${{ matrix.scanner }}
          path: >-
            ${{ github.workspace }}/${{
              needs.bootstrap.outputs.report_directory
            }}/${{ matrix.scanner }}
          if-no-files-found: warn

  build_test:
    needs: [bootstrap, validate_secrets]
    if: |
      always() && needs.bootstrap.result == 'success' &&
      needs.validate_secrets.result != 'failure' &&
      needs.bootstrap.outputs.build_stage == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: TasniimCh/Platform-Pipeline
          ref: risk-advisor
          path: platform
      - name: Install required tools
        shell: bash
        run: |
          set -euo pipefail
          export WORKSPACE="$GITHUB_WORKSPACE"
          export CONFIG_FILE="${{ needs.bootstrap.outputs.config_file }}"
          export REPORT_DIR="${{ needs.bootstrap.outputs.report_directory }}"
          export LOG_LEVEL="${{ needs.bootstrap.outputs.log_level }}"
          # No scanner/policy/container tool applies to build & test — pass an
          # explicit empty filter so only the unconditional PyYAML install runs.
          # If build-test/run.sh handles its own runtime/package-manager setup
          # (node version, etc.), this step can likely be dropped entirely —
          # confirm against that script's actual requirements.
          bash "${{ github.workspace }}/platform/platform/bootstrap/install-tools.sh" "${{ github.workspace }}/${{ needs.bootstrap.outputs.config_file }}" ""
      - name: Run Build & Test provider
        shell: bash
        run: |
          set -euo pipefail
          export WORKSPACE="$GITHUB_WORKSPACE"
          export CONFIG_FILE="${{ needs.bootstrap.outputs.config_file }}"
          export REPORT_DIR="${{ needs.bootstrap.outputs.report_directory }}"
          export LOG_LEVEL="${{ needs.bootstrap.outputs.log_level }}"
          bash "${{ github.workspace }}/platform/platform/build-test/run.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: report-build-test
          path: .devsecops/reports/build
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: report-tests
          path: .devsecops/reports/tests
          if-no-files-found: warn

  policy_testing:
    needs: [bootstrap, validate_secrets]
    if: |
      always() && needs.bootstrap.result == 'success' &&
      needs.validate_secrets.result != 'failure' &&
      fromJson(needs.bootstrap.outputs.capabilities).policy_enforcement == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: TasniimCh/Platform-Pipeline
          ref: risk-advisor
          path: platform
      - name: Install required tools
        shell: bash
        run: |
          set -euo pipefail
          export WORKSPACE="$GITHUB_WORKSPACE"
          export CONFIG_FILE="${{ needs.bootstrap.outputs.config_file }}"
          export REPORT_DIR="${{ needs.bootstrap.outputs.report_directory }}"
          export LOG_LEVEL="${{ needs.bootstrap.outputs.log_level }}"
          bash "${{ github.workspace }}/platform/platform/bootstrap/install-tools.sh" "${{ github.workspace }}/${{ needs.bootstrap.outputs.config_file }}" "conftest"
      - name: Run CI Policy Testing provider
        shell: bash
        run: |
          set -euo pipefail
          export WORKSPACE="$GITHUB_WORKSPACE"
          export CONFIG_FILE="${{ needs.bootstrap.outputs.config_file }}"
          export REPORT_DIR="${{ needs.bootstrap.outputs.report_directory }}"
          export LOG_LEVEL="${{ needs.bootstrap.outputs.log_level }}"
          bash "${{ github.workspace }}/platform/platform/policy/run.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: report-policy
          path: .devsecops/reports/policy
          if-no-files-found: warn

  # ──────────────────────────────────────────────────────────────────
  # STAGE 3 — container / supply chain. Only waits on build_test
  # because it typically needs the app to have built & passed tests
  # before it's worth containerizing. DOCKERHUB_USERNAME/TOKEN are only
  # referenced inside the publish step, gated on image_publish — a
  # client who only wants SBOM+scan (no registry push) never needs
  # those secrets at all.
  # ──────────────────────────────────────────────────────────────────
  supply_chain:
    needs: [bootstrap, validate_secrets, build_test]

    if: |
      always() && needs.bootstrap.result == 'success' &&
      needs.validate_secrets.result != 'failure' &&
      needs.build_test.result != 'failure' &&
      needs.bootstrap.outputs.container_stage == 'true'

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout platform repository
        uses: actions/checkout@v4
        with:
          repository: TasniimCh/Platform-Pipeline
          ref: risk-advisor
          path: platform

      - name: Install required container tools
        shell: bash
        env:
          CAPABILITIES_JSON: ${{ needs.bootstrap.outputs.capabilities }}
        run: |
          set -euo pipefail

          export WORKSPACE="$GITHUB_WORKSPACE"
          export CONFIG_FILE="${{ needs.bootstrap.outputs.config_file }}"
          export REPORT_DIR="${{ needs.bootstrap.outputs.report_directory }}"
          export LOG_LEVEL="${{ needs.bootstrap.outputs.log_level }}"

          tools="$(
            python3 - <<'PY'
          import json
          import os

          caps = json.loads(os.environ["CAPABILITIES_JSON"])

          tools = []

          if caps.get("container_scan", False):
              tools.append("trivy")

          if caps.get("sbom", False):
              tools.append("syft")

          if caps.get("image_signing", False):
              tools.append("cosign")

          print(" ".join(tools))
          PY
          )"

          if [ -n "$tools" ]; then
            echo "[INFO] Installing required supply-chain tools: $tools"

            bash "${{ github.workspace }}/platform/platform/bootstrap/install-tools.sh" \
              "${{ github.workspace }}/${{ needs.bootstrap.outputs.config_file }}" \
              "$tools"
          else
            echo "[INFO] No additional supply-chain tools are required"
          fi

      - name: Validate supply-chain capability relationships
        shell: bash
        run: |
          set -euo pipefail

          capabilities='${{ needs.bootstrap.outputs.capabilities }}'

          CAPABILITIES="$capabilities" python3 - <<'PY'
          import json
          import os
          import sys

          caps = json.loads(os.environ["CAPABILITIES"])

          image_publish = bool(caps.get("image_publish", False))
          image_signing = bool(caps.get("image_signing", False))

          if image_signing and not image_publish:
              print(
                  "[ERROR] image_signing is enabled but image_publish is disabled.",
                  file=sys.stderr,
              )
              print(
                  "[ERROR] Platform image signing requires a published registry image "
                  "identified by repository@sha256:digest.",
                  file=sys.stderr,
              )
              print(
                  "[ERROR] Enable image_publish or disable image_signing.",
                  file=sys.stderr,
              )
              sys.exit(2)

          print("[INFO] Supply-chain capability relationships are valid.")
          PY

      - name: Build local image and generate supply-chain evidence
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          CI_WORKFLOW_REF: ${{ github.workflow_ref }}
          CI_RUN_ID: ${{ github.run_id }}
          BUILDER_ID: https://github.com/actions/runner
        run: |
          set -euo pipefail

          export WORKSPACE="$GITHUB_WORKSPACE"
          export CONFIG_FILE="${{ needs.bootstrap.outputs.config_file }}"
          export REPORT_DIR="${{ needs.bootstrap.outputs.report_directory }}"
          export LOG_LEVEL="${{ needs.bootstrap.outputs.log_level }}"

          bash "${{ github.workspace }}/platform/platform/container/run.sh"
      - name: Publish image
        if: ${{ fromJson(needs.bootstrap.outputs.capabilities).image_publish == true }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          export WORKSPACE="$GITHUB_WORKSPACE"
          export CONFIG_FILE="${{ needs.bootstrap.outputs.config_file }}"
          export REPORT_DIR="${{ needs.bootstrap.outputs.report_directory }}"
          export LOG_LEVEL="${{ needs.bootstrap.outputs.log_level }}"

          echo "[INFO] image_publish is enabled"
          echo "[INFO] Publishing the platform-built image and resolving its immutable registry digest"

          bash "${{ github.workspace }}/platform/platform/container/publish.sh"

      - name: Resolve published image identity
        id: published-image
        if: ${{ fromJson(needs.bootstrap.outputs.capabilities).image_publish == true }}
        shell: bash
        run: |
          set -euo pipefail

          export REPORT_DIR="${{ needs.bootstrap.outputs.report_directory }}"

          python3 - <<'PY'
          import glob
          import json
          import os
          import re
          import sys

          report_dir = os.environ["REPORT_DIR"]

          candidates = sorted(
              glob.glob(
                  os.path.join(
                      report_dir,
                      "container",
                      "*",
                      "metadata.json",
                  )
              )
          )

          if not candidates:
              print(
                  "[ERROR] No container metadata found after image publication.",
                  file=sys.stderr,
              )
              sys.exit(5)

          metadata_file = candidates[-1]

          with open(metadata_file, "r", encoding="utf-8") as handle:
              metadata = json.load(handle)

          if metadata.get("published") is not True:
              print(
                  "[ERROR] Container metadata does not confirm successful publication.",
                  file=sys.stderr,
              )
              print(
                  "[ERROR] Signing and attestation require a published registry image.",
                  file=sys.stderr,
              )
              sys.exit(5)

          repository = str(
              metadata.get("registry_repository") or ""
          ).strip()

          digest = str(
              metadata.get("image_digest") or ""
          ).strip()

          if not repository:
              print(
                  "[ERROR] Published metadata is missing registry_repository.",
                  file=sys.stderr,
              )
              sys.exit(5)

          if not re.fullmatch(r"sha256:[a-fA-F0-9]{64}", digest):
              print(
                  "[ERROR] Published metadata does not contain a valid registry digest.",
                  file=sys.stderr,
              )
              sys.exit(5)

          print(
              f"[INFO] Immutable published image resolved: "
              f"{repository}@{digest}"
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"repository={repository}\n")
              out.write(f"digest={digest}\n")
              out.write(f"metadata-file={metadata_file}\n")
          PY

      - name: Sign published image
        if: ${{ fromJson(needs.bootstrap.outputs.capabilities).image_signing == true }}
        shell: bash
        run: |
          set -euo pipefail

          image_repository="${{ steps.published-image.outputs.repository }}"
          image_digest="${{ steps.published-image.outputs.digest }}"

          if [ -z "$image_repository" ] || [ -z "$image_digest" ]; then
            echo "[ERROR] Image signing was requested but no published image identity was resolved"
            exit 5
          fi

          echo "[INFO] Signing immutable image: ${image_repository}@${image_digest}"

          bash "${{ github.workspace }}/platform/platform/container/sign.sh" \
            "$image_repository" \
            "$image_digest"

      - name: Resolve provenance evidence
        id: provenance
        if: |
          ${{ fromJson(needs.bootstrap.outputs.capabilities).provenance == true &&
              fromJson(needs.bootstrap.outputs.capabilities).image_publish == true }}
        shell: bash
        run: |
          set -euo pipefail

          metadata_file="${{ steps.published-image.outputs.metadata-file }}"

          if [ -z "$metadata_file" ] || [ ! -f "$metadata_file" ]; then
            echo "[ERROR] Published container metadata is unavailable"
            exit 5
          fi

          provenance_file="$(python3 - "$metadata_file" <<'PY'
          import json
          import sys
          from pathlib import Path

          metadata_path = Path(sys.argv[1])

          with metadata_path.open("r", encoding="utf-8") as handle:
              metadata = json.load(handle)

          provenance = (
              metadata.get("reports", {}).get("provenance") or ""
          )

          if not provenance:
              raise SystemExit(
                  "Container metadata does not reference provenance evidence"
              )

          path = Path(provenance)

          if not path.is_file():
              raise SystemExit(
                  f"Provenance evidence does not exist: {path}"
              )

          print(path)
          PY
          )"

          echo "[INFO] Provenance evidence resolved: $provenance_file"
          echo "file=$provenance_file" >> "$GITHUB_OUTPUT"

      - name: Attest published image provenance
        if: |
          ${{ fromJson(needs.bootstrap.outputs.capabilities).provenance == true &&
              fromJson(needs.bootstrap.outputs.capabilities).image_signing == true &&
              fromJson(needs.bootstrap.outputs.capabilities).image_publish == true }}
        shell: bash
        run: |
          set -euo pipefail

          image_repository="${{ steps.published-image.outputs.repository }}"
          image_digest="${{ steps.published-image.outputs.digest }}"
          provenance_file="${{ steps.provenance.outputs.file }}"

          if [ -z "$image_repository" ] || [ -z "$image_digest" ]; then
            echo "[ERROR] Provenance attestation requires a published image identity"
            exit 5
          fi

          if [ -z "$provenance_file" ] || [ ! -f "$provenance_file" ]; then
            echo "[ERROR] Provenance attestation requires a valid provenance document"
            exit 5
          fi

          echo "[INFO] Attesting provenance for immutable image:"
          echo "[INFO] ${image_repository}@${image_digest}"

          bash "${{ github.workspace }}/platform/platform/container/attest.sh" \
            "$image_repository" \
            "$image_digest" \
            "$provenance_file"

      - name: Upload supply-chain report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: report-supply-chain
          path: .devsecops/reports/container
          if-no-files-found: warn

  # ──────────────────────────────────────────────────────────────────
  # STAGE 4 — AI Risk Advisor: aggregates every report that actually
  # ran (skipped stages simply contribute nothing) and produces the
  # deterministic decision. Only blocked by an actual secret leak.
  # ──────────────────────────────────────────────────────────────────
  risk_assessment:
    needs: [bootstrap, validate_secrets, code_scans, build_test, policy_testing, supply_chain]
    if: |
      always() && needs.bootstrap.result == 'success' &&
      needs.validate_secrets.result != 'failure'
    runs-on: ubuntu-latest
    outputs:
      decision: ${{ steps.run-risk-advisor.outputs.decision }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: TasniimCh/Platform-Pipeline
          ref: risk-advisor
          path: platform
      - name: Download report artifacts
        uses: actions/download-artifact@v4
        with:
          path: .devsecops/reports
          pattern: "report-*"
          merge-multiple: false
      - name: Install required tools
        shell: bash
        run: |
          set -euo pipefail
          export WORKSPACE="$GITHUB_WORKSPACE"
          export CONFIG_FILE="${{ needs.bootstrap.outputs.config_file }}"
          export REPORT_DIR="${{ needs.bootstrap.outputs.report_directory }}"
          export LOG_LEVEL="${{ needs.bootstrap.outputs.log_level }}"
          # risk/run.sh reads merged config + report JSON, not any scanner CLI —
          # empty filter keeps this to the unconditional PyYAML install.
          bash "${{ github.workspace }}/platform/platform/bootstrap/install-tools.sh" "${{ github.workspace }}/${{ needs.bootstrap.outputs.config_file }}" ""
      - name: Run AI Risk Advisor provider
        id: run-risk-advisor
        shell: bash
        run: |
          set -euo pipefail
          export WORKSPACE="$GITHUB_WORKSPACE"
          export CONFIG_FILE="${{ needs.bootstrap.outputs.config_file }}"
          export REPORT_DIR="${{ needs.bootstrap.outputs.report_directory }}"
          export LOG_LEVEL="${{ needs.bootstrap.outputs.log_level }}"
          bash "${{ github.workspace }}/platform/platform/risk/run.sh"
          decision=$(python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path(".devsecops/reports/risk/assessment.json")
          if not path.exists():
              raise SystemExit("Missing risk assessment report")
          payload = json.loads(path.read_text(encoding="utf-8"))
          print(payload.get("decision_reference", {}).get("action", "manual_approval"))
          PY
          )
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: report-risk
          path: .devsecops/reports/risk
          if-no-files-found: warn

  # ──────────────────────────────────────────────────────────────────
  # STAGE 5 — GitOps update. Gated on BOTH the capability flag and the
  # decision, so GITOPS_TOKEN is never dereferenced for a client who
  # never enabled gitops_update — unlike V0, where the job could reach
  # the "clone GitOps repo" step purely because the decision happened
  # to be 'promote', regardless of whether the client wanted this stage.
  # ──────────────────────────────────────────────────────────────────
  gitops:
    needs: [bootstrap, risk_assessment]
    if: |
      always() && needs.risk_assessment.result == 'success' &&
      fromJson(needs.bootstrap.outputs.capabilities).gitops_update == true &&
      (needs.risk_assessment.outputs.decision == 'promote' || needs.risk_assessment.outputs.decision == 'manual_approval')
    runs-on: ubuntu-latest
    env:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: TasniimCh/Platform-Pipeline
          ref: risk-advisor
          path: platform
      - name: Resolve GitOps repository metadata
        id: gitops-meta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          import yaml

          config_file = Path("${{ needs.bootstrap.outputs.config_file }}")
          data = yaml.safe_load(config_file.read_text(encoding="utf-8")) or {}
          gitops = data.get("gitops", {})
          repository = gitops.get("repository")
          ref = gitops.get("ref") or "main"
          values_file = gitops.get("values_file")

          if not repository or not values_file:
              raise SystemExit("gitops_update is enabled but gitops.repository / gitops.values_file are missing from the config")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"repository={repository}\n")
              out.write(f"ref={ref}\n")
              out.write(f"values_file={values_file}\n")
          PY
      - name: Checkout client GitOps repository
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GITOPS_TOKEN:-}" ]; then
            echo "GITOPS_TOKEN is required because gitops_update is enabled"
            exit 2
          fi
          repo="${{ steps.gitops-meta.outputs.repository }}"
          ref="${{ steps.gitops-meta.outputs.ref }}"
          git clone --branch "$ref" --depth 1 "https://x-access-token:${GITOPS_TOKEN}@github.com/${repo}.git" "$GITHUB_WORKSPACE/gitops-repo"
      - uses: actions/download-artifact@v4
        with:
          name: report-container
          path: .devsecops/reports/container
      - name: Resolve runtime image
        shell: bash
        run: |
          set -euo pipefail
          image_digest="$(python3 - <<'PY'
          import glob, json, os
          candidates = sorted(glob.glob(os.path.join(".devsecops", "reports", "container", "*", "metadata.json")))
          if not candidates:
              raise SystemExit("No container metadata found for image digest resolution")
          with open(candidates[-1], "r", encoding="utf-8") as handle:
              payload = json.load(handle)
          digest = payload.get("image_digest") or payload.get("image_id") or payload.get("image") or ""
          if not digest:
              raise SystemExit("Container metadata is missing image identity")
          print(digest)
          PY
          )"
          image_repository="$(python3 - <<'PY'
          import glob, json, os
          candidates = sorted(glob.glob(os.path.join(".devsecops", "reports", "container", "*", "metadata.json")))
          with open(candidates[-1], "r", encoding="utf-8") as handle:
              payload = json.load(handle)
          image_ref = payload.get("registry_repository") or payload.get("image") or ""
          if not image_ref:
              raise SystemExit("Container metadata is missing image reference")
          print(image_ref.split(":", 1)[0])
          PY
          )"
          echo "IMAGE_DIGEST=${image_digest}" >> "$GITHUB_ENV"
          echo "IMAGE_REPOSITORY=${image_repository}" >> "$GITHUB_ENV"
      - name: Run GitOps update provider
        shell: bash
        run: |
          set -euo pipefail
          export WORKSPACE="$GITHUB_WORKSPACE"
          export CONFIG_FILE="${{ needs.bootstrap.outputs.config_file }}"
          export REPORT_DIR="${{ needs.bootstrap.outputs.report_directory }}"
          export LOG_LEVEL="${{ needs.bootstrap.outputs.log_level }}"
          export GITOPS_REPO_PATH="$GITHUB_WORKSPACE/gitops-repo"
          export GITOPS_VALUES_FILE="${{ steps.gitops-meta.outputs.values_file }}"
          export GITOPS_REF="${{ steps.gitops-meta.outputs.ref }}"
          # Pass the ACTUAL decision through — do not hardcode "promote".
          # The provider script should branch on manual_approval (e.g. open
          # a PR for human review) vs promote (e.g. commit directly).
          export GITOPS_DECISION="${{ needs.risk_assessment.outputs.decision }}"
          export IMAGE_REPOSITORY="$IMAGE_REPOSITORY"
          export IMAGE_DIGEST="$IMAGE_DIGEST"
          bash "${{ github.workspace }}/platform/platform/gitops/run.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: report-gitops
          path: .devsecops/reports/gitops
          if-no-files-found: warn

  # ──────────────────────────────────────────────────────────────────
  # STAGE 6 — ephemeral-cluster validation. Gated on its own capability
  # flag, independent of whether gitops_update ran — a client can want
  # manifest/admission validation on a throwaway kind cluster without
  # ever pushing to a real GitOps repo.
  # ──────────────────────────────────────────────────────────────────
  cluster_validation:
    needs: [bootstrap, gitops]
    if: |
      always() && fromJson(needs.bootstrap.outputs.capabilities).cluster_validation == true &&
      needs.gitops.result != 'failure'
    runs-on: ubuntu-latest
    env:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: TasniimCh/Platform-Pipeline
          ref: risk-advisor
          path: platform
      - name: Create ephemeral kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: pipeline-validation
          wait: 120s
      - name: Verify cluster
        shell: bash
        run: |
          set -euo pipefail
          kubectl cluster-info
          kubectl get nodes
      - name: Install required tools
        shell: bash
        run: |
          set -euo pipefail
          export WORKSPACE="$GITHUB_WORKSPACE"
          export CONFIG_FILE="${{ needs.bootstrap.outputs.config_file }}"
          export REPORT_DIR="${{ needs.bootstrap.outputs.report_directory }}"
          export LOG_LEVEL="${{ needs.bootstrap.outputs.log_level }}"
          bash "${{ github.workspace }}/platform/platform/bootstrap/install-tools.sh" "${{ github.workspace }}/${{ needs.bootstrap.outputs.config_file }}" "kyverno"
      - name: Run cluster validation provider
        shell: bash
        run: |
          set -euo pipefail
          export WORKSPACE="$GITHUB_WORKSPACE"
          export CONFIG_FILE="${{ needs.bootstrap.outputs.config_file }}"
          export REPORT_DIR="${{ needs.bootstrap.outputs.report_directory }}"
          export LOG_LEVEL="${{ needs.bootstrap.outputs.log_level }}"
          export GITOPS_TOKEN="${GITOPS_TOKEN}"
          bash "${{ github.workspace }}/platform/platform/cluster-validation/run.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: report-cluster-validation
          path: .devsecops/reports/cluster-validation
          if-no-files-found: warn

  pipeline_summary:
    needs: [bootstrap, validate_secrets, code_scans, build_test, policy_testing, supply_chain, risk_assessment, gitops, cluster_validation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize pipeline outcome
        shell: bash
        run: |
          set -euo pipefail
          echo "Secret scan:         ${{ needs.validate_secrets.result }}"
          echo "Code/dependency/IaC:  ${{ needs.code_scans.result }}"
          echo "Build & tests:        ${{ needs.build_test.result }}"
          echo "Policy testing:       ${{ needs.policy_testing.result }}"
          echo "Supply chain:         ${{ needs.supply_chain.result }}"
          echo "Risk assessment:      ${{ needs.risk_assessment.result }} (decision: ${{ needs.risk_assessment.outputs.decision }})"
          echo "GitOps update:        ${{ needs.gitops.result }}"
          echo "Cluster validation:   ${{ needs.cluster_validation.result }}"