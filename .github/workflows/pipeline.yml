name: Platform Pipeline

on:
  push:
  workflow_call:
    inputs:
      config-file:
        type : string
        required: false
        default: .devsecops/pipeline.yaml
      report-directory:
        type : string
        required: false
        default: .devsecops/reports
      log-level:
        type : string
        required: false
        default: info

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    outputs:
      config-file: ${{ steps.set-vars.outputs.config-file }}
      report-directory: ${{ steps.set-vars.outputs.report-directory }}
      log-level: ${{ steps.set-vars.outputs.log-level }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set required variables
        id: set-vars
        run: |
          echo "config-file=${{ inputs.config-file }}" >> $GITHUB_OUTPUT
          echo "report-directory=${{ inputs.report-directory }}" >> $GITHUB_OUTPUT
          echo "log-level=${{ inputs.log-level }}" >> $GITHUB_OUTPUT

      - name: Checkout platform repository
        uses: actions/checkout@v4
        with:
          repository: TasniimCh/Platform-Pipeline
          ref: ci-foundation
          path: platform

      - name: Debug platform checkout
        shell: bash
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "===== ROOT ====="
          ls -la "$GITHUB_WORKSPACE"
          echo "===== PLATFORM ====="
          ls -la "$GITHUB_WORKSPACE/platform" || true
          echo "===== PLATFORM/PLATFORM ====="
          ls -la "$GITHUB_WORKSPACE/platform/platform" || true
          echo "===== BOOTSTRAP ====="
          ls -la "$GITHUB_WORKSPACE/platform/platform/bootstrap" || true
          echo "===== FIND ====="
          find "$GITHUB_WORKSPACE" -name bootstrap.sh

      - name: Bootstrap platform environment
        shell: bash
        run: |
          set -euo pipefail
          export WORKSPACE="$GITHUB_WORKSPACE"
          export CONFIG_FILE="${{ inputs.config-file }}"
          export REPORT_DIR="${{ inputs.report-directory }}"
          export LOG_LEVEL="${{ inputs.log-level }}"
          bash "${{ github.workspace }}/platform/platform/bootstrap/bootstrap.sh"
          bash "${{ github.workspace }}/platform/platform/bootstrap/install-tools.sh" "${{ github.workspace }}/${{ inputs.config-file }}"

  scanners:
    needs: bootstrap
    runs-on: ubuntu-latest
    strategy:
      matrix:
        scanner: [gitleaks, semgrep, snyk, checkov]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Checkout platform repository
        uses: actions/checkout@v4
        with:
          repository: TasniimCh/Platform-Pipeline
          ref: ci-foundation
          path: platform

      - name: Install scanner tools
        shell: bash
        run: |
          set -euo pipefail
          export WORKSPACE="$GITHUB_WORKSPACE"
          export CONFIG_FILE="${{ needs.bootstrap.outputs.config-file }}"
          export REPORT_DIR="${{ needs.bootstrap.outputs.report-directory }}"
          export LOG_LEVEL="${{ needs.bootstrap.outputs.log-level }}"
          bash "${{ github.workspace }}/platform/platform/bootstrap/install-tools.sh" "${{ github.workspace }}/${{ needs.bootstrap.outputs.config-file }}"

      - name: Run scanner
        shell: bash
        run: |
          set -euo pipefail
          export WORKSPACE="$GITHUB_WORKSPACE"
          export CONFIG_FILE="${{ needs.bootstrap.outputs.config-file }}"
          export REPORT_DIR="${{ needs.bootstrap.outputs.report-directory }}"
          export LOG_LEVEL="${{ needs.bootstrap.outputs.log-level }}"
          bash "${{ github.workspace }}/platform/platform/scanners/run-scanner.sh" "${{ matrix.scanner }}"

  upload_reports:
    needs: scanners
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload standardized reports
        uses: actions/upload-artifact@v3
        with:
          name: devsecops-reports
          path: .devsecops/reports
