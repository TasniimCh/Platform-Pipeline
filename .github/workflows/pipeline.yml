name: Platform Pipeline

on:
  workflow_call:

jobs:
  context:
    runs-on: ubuntu-latest

    steps:
      - name: Setup platform
        uses: ./.github/actions/setup

      - name: Load Context
        run: bash platform/scripts/load-context.sh

  phase1:
    needs: context
    runs-on: ubuntu-latest

    steps:
      - name: Setup platform
        uses: ./.github/actions/setup

      - name: Run Phase 1
        run: bash platform/scripts/phase1.sh